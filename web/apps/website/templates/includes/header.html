<!-- Хедер -->
<header class="main-header">
  <div class="header-container">
    <!-- Логотип и Название -->
    <a href="{% url 'website:index' %}" class="header-brand">
        <div class="logo-placeholder"></div>

        <div class="brand-text">
            <h1 class="brand-title">ЧИТИНСКАЯ ЦРБ</h1>
            <p class="brand-subtitle">Государственное учреждение здравоохранения</p>
        </div>
    </a>
    <!-- Контакты и Инструменты -->
    <div class="header-info">
      <!-- Адрес -->
      <div class="info-block">
        <svg
          class="info-icon-svg"

            />
          </g>

        <div class="info-text">
          <span>г. Чита, ул. Ленинградская, 57</span>

      </div>

      <!-- Телефон и Время работы -->
      <div class="info-block">
        <svg
          class="info-icon-svg"
          xmlns="http://www.w3.org/2000/svg"
          id="Layer_1"
          data-name="Layer 1"
          viewBox="0 0 24 24"
        >

            d="M13,1a1,1,0,0,1,1-1A10.011,10.011,0,0,1,24,10a1,1,0,0,1-2,0,8.009,8.009,0,0,0-8-8A1,1,0,0,1,13,1Zm1,5a4,4,0,0,1,4,4,1,1,0,0,0,2,0,6.006,6.006,0,0,0-6-6,1,1,0,0,0,0,2Zm9.093,10.739a3.1,3.1,0,0,1,0,4.378l-.91,1.049c-8.19,7.841-28.12-12.084-20.4-20.3l1.15-1A3.081,3.081,0,0,1,7.26.906c.031.031,1.884,2.438,1.884,2.438a3.1,3.1,0,0,1-.007,4.282L7.979,9.082a12.781,12.781,0,0,0,6.931,6.945l1.465-1.165a3.1,3.1,0,0,1,4.281-.006S23.062,16.708,23.093,16.739Zm-1.376,1.454s-2.393-1.841-2.424-1.872a1.1,1.1,0,0,0-1.549,0c-.027.028-2.044,1.635-2.044,1.635a1,1,0,0,1-.979.152A15.009,15.009,0,0,1,5.9,9.3a1,1,0,0,1,.145-1S7.652,6.282,7.679,6.256a1.1,1.1,0,0,0,0-1.549c-.031-.03-1.872-2.425-1.872-2.425a1.1,1.1,0,0,0-1.51.039l-1.15,1C-2.495,10.105,14.776,26.418,20.721,20.8l.911-1.05A1.121,1.121,0,0,0,21.717,18.193Z"
          />
        </svg>
        <div class="info-text">
          <a href="tel:+73022211180" class="phone-link">+7 (3022) 21-11-80</a>
          <span class="schedule">Пн-Пт: 8:00 - 17:15</span>
          <span class="schedule">Сб: 9:00 - 15:00</span>
        </div>
      </div>

      <!-- Версия для слабовидящих -->
      <button class="accessibility-btn">
        <svg
          class="info-icon-svg"
          xmlns="http://www.w3.org/2000/svg"
          id="Outline"
          viewBox="0 0 24 24"
        >
          <path
            d="M23.271,9.419C21.72,6.893,18.192,2.655,12,2.655S2.28,6.893.729,9.419a4.908,4.908,0,0,0,0,5.162C2.28,17.107,5.808,21.345,12,21.345s9.72-4.238,11.271-6.764A4.908,4.908,0,0,0,23.271,9.419Zm-1.705,4.115C20.234,15.7,17.219,19.345,12,19.345S3.766,15.7,2.434,13.534a2.918,2.918,0,0,1,0-3.068C3.766,8.3,6.781,4.655,12,4.655s8.234,3.641,9.566,5.811A2.918,2.918,0,0,1,21.566,13.534Z"
          />
          <path
            d="M12,7a5,5,0,1,0,5,5A5.006,5.006,0,0,0,12,7Zm0,8a3,3,0,1,1,3-3A3,3,0,0,1,12,15Z"
          />
        </svg>
        <span>Версия для слабовидящих</span>
      </button>

      <!-- Личный кабинет -->
      <!-- Личный кабинет -->
      {% if request.user.is_authenticated %}
        <!-- Блок для АВТОРИЗОВАННОГО пользователя (Выпадающее меню) -->
        <div class="user-dropdown">
          <div class="user-dropdown-toggle">
            <div class="user-avatar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b72f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <!-- Выводим фамилию и инициалы (предполагается, что это вернет метод или поле) -->
            <span class="user-name">{{ request.user.short_name }}</span>
            <svg class="dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          
          <!-- Сама выпадашка -->
          <div class="user-dropdown-menu">
            <a href="{% url 'cabinet:patient_cabinet' %}" class="dropdown-item">Личный кабинет</a>
            <div class="dropdown-divider"></div>
            <a href="{% url 'cabinet:logout' %}" class="dropdown-item logout-link">Выйти</a>
          </div>
        </div>
      {% else %}
        <!-- Блок для АНОНИМНОГО пользователя (Старая кнопка Войти) -->
        <a href="{% url 'cabinet:login' %}" class="login-btn">
          <svg class="login-icon-svg" xmlns="http://www.w3.org/2000/svg" id="Outline" viewBox="0 0 24 24">
            <path d="M12,12A6,6,0,1,0,6,6,6.006,6.006,0,0,0,12,12ZM12,2A4,4,0,1,1,8,6,4,4,0,0,1,12,2Z"/>
            <path d="M12,14a9.01,9.01,0,0,0-9,9,1,1,0,0,0,2,0,7,7,0,0,1,14,0,1,1,0,0,0,2,0A9.01,9.01,0,0,0,12,14Z"/>
          </svg>
          <span>Войти в кабинет</span>
        </a>
      {% endif %}

    </div>
  </div>
</header>

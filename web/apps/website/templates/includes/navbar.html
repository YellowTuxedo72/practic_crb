    <nav class="main-nav">
      <div class="nav-container">
        <!-- Список пунктов меню -->
        <ul class="nav-menu">

          <li class="nav-item {% if request.path == '/' %}active{% endif %}">
            <a href="{% url 'website:index' %}" class="nav-link">
              Главная
            </a>
          </li>


          {% for section in navigation_sections %}
            <li class="nav-item has-dropdown">

              <a href="#" class="nav-link">
                {{ section.title }}

                <svg class="arrow-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
                  <path d="M7 10l5 5 5-5z" />
                </svg>

              </a>

              <ul class="dropdown-menu">

                {% for page in section.pages.all %}
                  {% if page.is_published %}
                    <li>
                      <a href="{% url 'website:page_detail' page.slug %}">
                        {{ page.title }}
                      </a>
                    </li>
                  {% endif %}
                {% endfor %}

              </ul>

            </li>
          {% endfor %}


          <!-- Специализированные разделы пока оставляем вручную -->

          <li class="nav-item">
            <a href="#" class="nav-link">Специалисты</a>
          </li>

          <li class="nav-item {% if '/news/' in request.path %}active{% endif %}">
            <a href="{% url 'website:news_page' %}" class="nav-link">
              Новости
            </a>
          </li>

          <li class="nav-item">
            <a href="#" class="nav-link">Школа СД</a>
          </li>

          <li class="nav-item">
            <a href="#" class="nav-link">Контакты</a>
          </li>

        </ul>

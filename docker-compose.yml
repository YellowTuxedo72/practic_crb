services:

  db:
    image: postgres:17-alpine
    container_name: practic-crb-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  fake-mis:
    build:
      context: ./fake_mis

    container_name: practic-crb-fake-mis
    restart: unless-stopped

    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "hospital_mis.wsgi:application"
      ]

    volumes:
      - ./fake_mis/db.sqlite3:/app/db.sqlite3

    expose:
      - "8000"

    ports:
      - "9000:8000"


  web:
    build:
      context: ./web

    container_name: practic-crb-web
    restart: unless-stopped

    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "config.wsgi:application"
      ]

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      MIS_BASE_URL: http://fake-mis:8000/api
      MIS_TIMEOUT: 5

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

    volumes:
      - web_media:/app/media

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

      fake-mis:
        condition: service_started


volumes:

  postgres_data:

  web_media:
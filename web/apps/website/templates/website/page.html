{% extends "base.html" %}
{% load static %}
{% load editorjs %}

{% block title %}
    {{ page.title }}
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/page.css' %}">
{% endblock %}

{% block content %}

<main class="page-container">

    <div class="page-header">
        <h1 class="page-title">{{ page.title }}</h1>
    </div>

    <article class="page-content">
        {{ page.content|render_editorjs }}
    </article>

</main>

{% endblock %}
